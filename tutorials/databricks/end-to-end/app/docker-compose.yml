# Silverline Lakehouse Explorer — runs anywhere with Docker.
#
#   server  → Apollo GraphQL + Express (PAT-based auth via the browser UI)
#   client  → static React/Vite bundle served by nginx
#
# No env vars or secrets needed before starting — all Databricks credentials
# (workspace URL + PAT) are entered through the browser UI after launch.
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080

services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    restart: unless-stopped

  client:
    build:
      context: ./client
      args:
        VITE_SERVER: localhost:4000
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
