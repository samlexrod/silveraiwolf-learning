# Silverline Lakehouse Explorer — runs anywhere with Docker.
#
#   server  → pre-built GraphQL/Apollo bundle (no source required)
#   client  → pre-built React bundle served by nginx
#
# Optional: add ANTHROPIC_API_KEY to enable the Claude chat assistant.
# Copy .env.example to .env and fill in the key, or pass it inline:
#   ANTHROPIC_API_KEY=sk-ant-... docker compose up
#
# Usage:
#   docker compose up --build
#   open http://localhost:8080

services:
  server:
    build: ./server
    ports:
      - "4000:4000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - PLATFORM_API_KEY=${PLATFORM_API_KEY:-}
      - PLATFORM_API_URL=${PLATFORM_API_URL:-https://silveraiwolf-platform-api.fly.dev}
    restart: unless-stopped

  client:
    build: ./client
    ports:
      - "8080:80"
    depends_on:
      - server
    restart: unless-stopped
